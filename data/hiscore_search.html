        .brand-banner {

            margin-top: 5px;
            display: block;

        /* Hi-tech selectiebox panelen */
        .selection-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-top: 4px solid #00f0ff; /* Cyaan top-lijn voor Normale modus */
            max-width: 1200px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        /* Tweede selectiebox krijgt een roze top-lijn (5-minuten modus) */
        .selection-box:nth-of-type(2) {
            border-top: 4px solid #ff0055;
        }

        .selection-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
																			/* De iconische gelaagde wit-cyaan-roze gloed */
            text-shadow: 
                0 0 5px #ffffff,
                0 0 15px #00f0ff,
                0 0 30px #00f0ff,
                0 0 45px #ff0055;
                }
      
        .form-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }

        /* Geavanceerde styling voor de dropdown menu's */
        select {
            background-color: #21262d;
            color: #e6edf3;
            padding: 8px 14px;
            font-size: 14px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid #30363d;
            box-sizing: border-box;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            min-width: 140px;
        }

        /* Dropdown focus / actieve staat */
        select:focus, select:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
            color: #ffffff;
        }

        /* Specifieke focuskleur voor de tweede box */
        .selection-box:nth-of-type(2) select:focus,
        .selection-box:nth-of-type(2) select:hover {
            border-color: #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.2);
        }

        /* Transformatie van de verzendknoppen naar echte neon arcade-knoppen */
        input[type="submit"] {
            font-family: 'Orbitron', sans-serif;
            padding: 8px 20px;
            font-size: 12px;
            border-radius: 4px;
            box-sizing: border-box;
            background: rgba(0, 240, 255, 0.05);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
		        }

        input[type="submit"]:hover {
            color: #ffffff;
            border-style: solid;
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            text-shadow: 0 0 5px #ffffff;
        }

        /* Roze knopvariant voor de 5-minuten modus verzendknop */
        .selection-box:nth-of-type(2) input[type="submit"] {
            color: #ff0055;
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.05);
        }

        .selection-box:nth-of-type(2) input[type="submit"]:hover {
            color: #ffffff;
            border-style: solid;
            background: rgba(255, 0, 85, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            text-shadow: 0 0 5px #ffffff;
        }
